<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despacho</title>
<meta name="description" content="Despacho de transfers: serviços, agenda, finanças e frota.">
<meta name="theme-color" content="#0B1C14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EEF0EA" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Despacho">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Nunito";font-style:normal;font-weight:200 1000;font-display:swap;src:url(fonts/nunito.woff2) format("woff2");}

:root{
  /* Layout: native-feeling phone app. Exactly four tabs per profile, a large title per tab, inset grouped lists, one primary action per screen, bottom sheets for detail, secondary information behind disclosure rows.
     Type: one rounded family. On iPhone it is the system's own SF Pro Rounded (ui-rounded); elsewhere Nunito. Times and totals use tabular figures.
     Colour: deep green and gold from the company palette. Gold marks what you can do, orange what needs attention, olive what a partner does. */
  --bg:#0B1C14;--surface:#12291F;--surface-2:#1B3629;--line:#22402F;--fg:#EEF0E7;--muted:#A0AB9E;
  --accent:#CAB26A;--accent-ink:#1B1704;--accent-soft:rgba(202,178,106,.15);
  --attn:#EB9B55;--on-attn:#1E1206;--bad:#EA7563;--on-bad:#FFFFFF;--ok:#86C58C;--info:#8FB5E8;--olive:#AEB86E;
  --wa:#25D366;--wa-ink:#06301A;--knob:#FFFFFF;
  --overlay:rgba(2,8,5,.62);--shadow:0 16px 40px rgba(0,0,0,.45);--lift:0 1px 3px rgba(0,0,0,.35);
  --f-body:ui-rounded,"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:ui-rounded,"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF0EA;--surface:#FFFFFF;--surface-2:#E3E6DE;--line:#DADDD3;--fg:#0D2119;--muted:#5A6359;
    --accent:#7D6820;--accent-ink:#FFFFFF;--accent-soft:rgba(125,104,32,.11);
    --attn:#B05617;--on-attn:#FFFFFF;--bad:#B23A2C;--on-bad:#FFFFFF;--ok:#2F7A44;--info:#2C5DA3;--olive:#5E6830;
    --overlay:rgba(14,24,18,.36);--shadow:0 16px 40px rgba(20,30,24,.16);--lift:0 1px 3px rgba(20,30,24,.16);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEF0EA;--surface:#FFFFFF;--surface-2:#E3E6DE;--line:#DADDD3;--fg:#0D2119;--muted:#5A6359;
  --accent:#7D6820;--accent-ink:#FFFFFF;--accent-soft:rgba(125,104,32,.11);
  --attn:#B05617;--on-attn:#FFFFFF;--bad:#B23A2C;--on-bad:#FFFFFF;--ok:#2F7A44;--info:#2C5DA3;--olive:#5E6830;
  --overlay:rgba(14,24,18,.36);--shadow:0 16px 40px rgba(20,30,24,.16);--lift:0 1px 3px rgba(20,30,24,.16);
  color-scheme:light;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html.locked,html.locked body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
button,.btn,.tabs,.srow,.nrow,.mrow,.qa,.chip-btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chev{width:18px;height:18px;color:var(--muted);flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 132px}
body.has-fab .app{padding-block-end:196px}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-inline:-16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;font-size:17px}
.brand svg{color:var(--accent);flex:none}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-r{display:flex;align-items:center;gap:8px;flex:none}
.bell{position:relative}
.bell .bn{position:absolute;top:-4px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--attn);color:var(--on-attn);font:600 11px/18px var(--f-body)}
.role{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);white-space:nowrap}
.role select{width:auto;max-width:150px;padding:8px 12px;border:0;border-radius:999px;background:var(--surface-2);color:var(--fg);font:500 15px/1.2 var(--f-body)}
@media (max-width:430px){.role .rl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}

/* page structure */
.page-h{margin:12px 0 2px}
.page-h h1{margin:0;font:700 30px/1.15 var(--f-body);letter-spacing:-.015em;text-wrap:balance}
.page-h p{margin:4px 0 0;color:var(--muted);font-size:15px}
.page-h.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.seg{display:flex;gap:2px;margin-top:16px;padding:3px;border-radius:12px;background:var(--surface-2);overflow-x:auto}
.seg button{flex:1;appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;color:var(--muted);font:500 15px/1 var(--f-body);padding:10px 8px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--lift)}
.seg .n{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--attn);color:var(--on-attn);font:600 12px/20px var(--f-body)}
.seg.in{margin-top:0}
.fmore-b .seg,.alloc .seg{background:var(--bg)}
.fmore-b .seg button[aria-pressed="true"],.alloc .seg button[aria-pressed="true"]{background:var(--surface-2)}
.sec{margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:24px;margin:0 4px 8px;font:600 15px/1.3 var(--f-body);color:var(--muted)}
.sec-h .tbtn{padding:0}
.group,.card-b{background:var(--surface);border-radius:16px;overflow:hidden}
.group > *{position:relative}
.group > * + *::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line);pointer-events:none}
.empty{margin-top:16px;padding:28px 20px;border-radius:16px;background:var(--surface);text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:17px;font-weight:600;margin-bottom:4px}
.empty .btn{margin-top:16px}
.fine{margin:18px 4px 0;color:var(--muted);font-size:14px;max-width:62ch}

/* search and filters */
.searchrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:16px}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{height:48px;padding-left:40px;border-color:transparent}
.fbtn{appearance:none;position:relative;display:inline-grid;place-items:center;width:48px;height:48px;padding:0;border:0;border-radius:12px;background:var(--surface);color:var(--fg);cursor:pointer}
.fbtn svg{width:20px;height:20px}
.fbtn.on{background:var(--accent-soft);color:var(--accent)}
.fbtn .bn{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:600 11px/18px var(--f-body)}
.fline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:12px 4px 0;font-size:14px;color:var(--muted)}
.fline b{color:var(--fg);font-weight:500}
.fline .tbtn{padding:2px 0;font-size:14px}

/* service rows */
.srow{appearance:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:14px;align-items:start;width:100%;padding:14px 16px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.srow:active{background:var(--surface-2)}
.srow .tm{min-width:58px;font:700 23px/1.1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.srow .tm small{display:block;margin-top:4px;font:500 13px/1.2 var(--f-body);color:var(--muted)}
.srow > .chev{align-self:center}
.rt{display:grid;gap:3px;min-width:0}
.rt > span{display:flex;align-items:center;gap:9px;min-width:0;font-size:16px;font-weight:500}
.rt em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid var(--muted);flex:none}
.pin.to{background:var(--fg);border-color:var(--fg)}
.pin.via{width:7px;height:7px;margin:0 1px;border-width:0;background:var(--muted)}
.sline{grid-column:2/-1;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:14px;color:var(--muted)}
.sline .who{margin-left:auto}
.sline .who.attn,.flag{color:var(--attn);font-weight:500}
.sline .who.ext,.ext{color:var(--olive);font-weight:500}
.sline .quote{color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:7px;color:var(--fg);font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.new{font:600 12px/1 var(--f-body);padding:4px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.srow.off{opacity:.5}
.srow.off .tm{text-decoration:line-through}
.rowqa .srow{padding-bottom:10px}
.qa-row{padding:0 16px 14px 88px}
.qa{appearance:none;padding:10px 16px;border:0;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:600 15px/1 var(--f-body);cursor:pointer;white-space:nowrap}
.confirm{display:grid;gap:12px;margin-bottom:10px;padding:16px;border-radius:16px;background:var(--surface)}
.confirm p{margin:0;font-weight:500}

/* driver: next service */
.next{appearance:none;display:grid;gap:14px;width:100%;padding:18px;border:0;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent);color:inherit;font:inherit;text-align:left;cursor:pointer}
.nx-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.nx-top .tm{font:700 44px/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-right:auto}
.nx-rt{display:grid;gap:8px}
.nx-rt span{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;font-size:17px;font-weight:500;line-height:1.35}
.nx-rt .pin{transform:translateY(-1px)}
.nx-who{color:var(--muted);font-size:15px}
.nx-go{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--line);color:var(--accent);font-weight:600}
.nx-go .chev{color:var(--accent)}
.memo{display:grid;gap:10px;margin-top:16px;padding:16px;border-radius:16px;background:var(--accent-soft)}
.memo b{color:var(--accent);font-size:14px;font-weight:600}
.memo p{margin:0;font-size:16px;white-space:pre-wrap}
.memo .tbtn{justify-self:start;padding:2px 0;font-size:15px}

/* buttons */
.btn{appearance:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 18px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:600 17px/1.2 var(--f-body);text-align:center;text-decoration:none;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--surface-2);color:var(--fg)}
.btn.alt.danger{background:var(--surface-2);color:var(--bad)}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.btn.wa{background:var(--wa);color:var(--wa-ink)}
.btn.sm{min-height:44px;padding:10px 14px;border-radius:12px;font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbtn{appearance:none;justify-self:center;padding:10px 6px;border:0;background:none;color:var(--accent);font:500 16px/1.2 var(--f-body);cursor:pointer}
.tbtn.muted{color:var(--muted)}
.tbtn.danger{color:var(--bad)}
.icbtn{appearance:none;display:inline-grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:var(--surface-2);color:var(--fg);cursor:pointer;flex:none}
.icbtn svg{width:18px;height:18px}
.icbtn:disabled{opacity:.35;cursor:not-allowed}
.foot-hint{margin:0;color:var(--muted);font-size:14px;text-align:center}
.menu{display:grid;background:var(--surface);border-radius:16px;overflow:hidden;max-height:52vh;overflow-y:auto}
.menu button{appearance:none;padding:15px 16px;border:0;background:none;color:var(--fg);font:500 17px/1.2 var(--f-body);text-align:left;cursor:pointer}
.menu > * + *{border-top:1px solid var(--line)}
.menu a{display:block;padding:15px 16px;color:var(--fg);font:500 17px/1.2 var(--f-body);text-decoration:none}
.menu .danger{color:var(--bad)}

/* tabs + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs button{appearance:none;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;padding:9px 2px 10px;border:0;background:none;color:var(--muted);font:600 12px/1.1 var(--f-body);cursor:pointer}
.tabs svg{width:24px;height:24px}
.tabs span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs .tb{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--attn);color:var(--on-attn);font:600 11px/18px var(--f-body)}
.fab{position:fixed;z-index:31;right:max(16px,calc(50vw - 264px));bottom:calc(82px + env(safe-area-inset-bottom,0px));appearance:none;display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 22px 0 18px;border:0;border-radius:27px;background:var(--accent);color:var(--accent-ink);font:600 17px/1 var(--f-body);box-shadow:var(--shadow);cursor:pointer}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--overlay);padding-top:calc(12px + env(safe-area-inset-top,0px))}
.sheet{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:var(--shadow);overflow:hidden;animation:rise .24s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(32px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 8px}
.sheet-head h2{margin:0;font:600 18px/1.25 var(--f-body);min-width:0}
.sheet-body{flex:1 1 auto;min-height:0;overflow:auto;padding:4px 16px 28px;overscroll-behavior:contain}
.sheet-foot{display:grid;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
@media (min-width:700px){.sheet-wrap{align-items:center;padding:28px}.sheet{height:auto;max-height:100%;border-radius:20px}}

/* service detail */
.dh{display:grid;gap:2px;margin:4px 0 22px}
.dh-time{margin-top:8px;font:700 50px/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dh-time small{margin-left:10px;color:var(--muted);font:600 22px/1 var(--f-num);letter-spacing:0}
.dh-date{color:var(--muted);font-size:15px}
.dh-sub{color:var(--muted);font-size:14px;margin-left:15px}
.rte{list-style:none;margin:0;padding:0;display:grid;gap:20px}
.rte li{position:relative;display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px}
.rte .pin{width:12px;height:12px;margin-top:5px}
.rte .pin.via{width:8px;height:8px;margin:7px 2px 0}
.rte li:not(:last-child)::after{content:"";position:absolute;left:5px;top:22px;bottom:-16px;width:2px;background:var(--line)}
.lbl{display:block;font-size:14px;color:var(--muted)}
.rte p{margin:2px 0 0;font-size:18px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.rte li.via p{font-size:16px}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-top:10px}
.nav .waze{display:inline-flex;align-items:center;min-height:42px;padding:0 18px;border-radius:21px;background:var(--accent);color:var(--accent-ink);font:600 15px/1 var(--f-body);text-decoration:none}
.nav .alt{font-size:15px}
.blk{margin-top:22px}
.cli{display:grid;gap:2px;padding:16px}
.cli b{font-size:18px;font-weight:600}
.cli .sub{color:var(--muted);font-size:15px}
.cli .tel-n{font-variant-numeric:tabular-nums;color:var(--fg);font-size:15px;margin-top:4px}
.cacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 16px}
.cacts.three{grid-template-columns:1fr 1fr 1fr}
.fl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
.fl b{display:block;font-size:17px;font-weight:600;letter-spacing:.02em}
.fl .btn{width:auto}
.hl-note{padding:14px 16px;border-radius:16px;background:var(--accent-soft);font-size:16px;overflow-wrap:anywhere}
.hl-note b{display:block;margin-bottom:4px;font-size:14px;font-weight:600;color:var(--accent)}
.hl-note p{margin:0;white-space:pre-wrap}
.hl-note p + p{margin-top:6px}
.notice{--c:var(--attn);display:grid;gap:4px;margin-bottom:16px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--c) 13%,transparent);font-size:15px}
.notice b{color:var(--c);font-weight:600}
.notice.bad{--c:var(--bad)} .notice.info{--c:var(--info)} .notice.ok{--c:var(--ok)} .notice.olive{--c:var(--olive)}
details.notice{display:block}
details.notice > summary{list-style:none;display:flex;align-items:center;gap:8px;color:var(--c);font-weight:600;cursor:pointer}
details.notice > summary::-webkit-details-marker{display:none}
details.notice > summary::after{content:"";width:7px;height:7px;margin-left:auto;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .15s}
details.notice[open] > summary::after{transform:rotate(225deg)}
details.notice p{margin:8px 0 0;color:var(--fg)}
details.notice p.hint{color:var(--muted)}
.more{margin-top:10px;background:var(--surface);border-radius:16px}
.more > summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:54px;padding:12px 16px;font-weight:500;cursor:pointer}
.more > summary::-webkit-details-marker{display:none}
.more > summary > span:first-child{flex:1}
.more > summary .cnt{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.more > summary::after{content:"";width:7px;height:7px;margin:0 3px 0 6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.more[open] > summary::after{transform:rotate(225deg)}
.more-b{padding:0 16px 14px}
.more-b.flush{padding:0 0 6px}
.more-b.flush > * + *{border-top:1px solid var(--line)}
.blk > .more:first-child{margin-top:0}
dl{margin:0}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0}
.kv dt{color:var(--muted);flex:none}
.kv dd{margin:0;min-width:0;text-align:right;overflow-wrap:anywhere}
.alloc{display:grid;gap:12px;margin-bottom:16px;padding:16px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent)}
.alloc h3{margin:0;font:600 17px/1.3 var(--f-body)}
.alloc select,.alloc input{background:var(--bg)}
.sug{display:grid;gap:3px;padding:14px;border-radius:14px;background:var(--accent-soft)}
.sug .k{color:var(--accent);font-size:13px;font-weight:600}
.sug b{font-size:17px;font-weight:600}
.sug .s{color:var(--muted);font-size:14px}
.sug .btn{margin-top:10px}
.sug.none{background:color-mix(in srgb,var(--attn) 13%,transparent)}

.tl .n{display:block;color:var(--muted);font-size:14px}
.erow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

.erow .ea small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.waitline{margin:16px 0 0;color:var(--muted);font-size:15px}
.oe{display:grid;gap:0;padding:4px 16px}
.oe .kv dd b{font-weight:600}
.files{display:flex;flex-wrap:wrap;gap:10px}
.files img{width:84px;height:84px;object-fit:cover;border-radius:10px;cursor:pointer}

/* money */
.mcard{background:var(--surface);border-radius:16px;overflow:hidden}

.mcard .brow + .brow{border-top:1px solid var(--line)}

.v.neg{color:var(--muted)}
.prov{color:var(--attn)}

.mprev b{font:700 20px/1 var(--f-num);font-variant-numeric:tabular-nums}
.mprev .prov{font-size:14px}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo > div{padding:14px 16px;border-radius:16px;background:var(--surface)}
.duo .k{display:block;color:var(--muted);font-size:14px}
.duo .v{display:block;margin-top:6px;font:700 23px/1.1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.duo small{display:block;margin-top:6px;color:var(--attn);font-size:13px;font-weight:500}

/* forms */
form{margin:0}
fieldset{border:0;margin:0 0 26px;padding:0;min-width:0;display:grid;gap:14px}
legend{padding:0;margin-bottom:12px;font:600 17px/1.3 var(--f-body)}
.f{display:grid;gap:6px;min-width:0}
.f > label,.lab{font-size:14px;color:var(--muted)}
input,select,textarea{width:100%;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:16px/1.35 var(--f-body)}

input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:16px;cursor:pointer}
.f.ai input,.f.ai select,.f.ai textarea{border-color:var(--accent);background:var(--accent-soft)}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g21{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;align-items:end}
.g3v{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.8fr);gap:10px;align-items:end}
.g3v select{padding-inline:10px}
@media (max-width:400px){.g2.stack{grid-template-columns:1fr}}
.err{margin:0;color:var(--bad);font-size:14px}
.hint{margin:0;color:var(--muted);font-size:14px}
details.fmore{margin:0 0 26px;background:var(--surface);border-radius:16px}
details.fmore > summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:54px;padding:12px 16px;font-weight:600;cursor:pointer}
details.fmore > summary::-webkit-details-marker{display:none}
details.fmore > summary > span:first-child{flex:1}
details.fmore > summary .cnt{color:var(--muted);font-weight:400}
details.fmore > summary::after{content:"";width:7px;height:7px;margin:0 3px 0 6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.fmore[open] > summary::after{transform:rotate(225deg)}
.fmore-b{display:grid;gap:14px;padding:2px 16px 16px}
.fmore-b input,.fmore-b select,.fmore-b textarea{background:var(--bg)}
.fmore-b .mprev{background:var(--surface-2)}
.banner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;margin-bottom:20px;padding:14px 16px;border-radius:16px;background:var(--accent-soft);font-size:15px}
.banner b{display:block;color:var(--accent)}
.thumb{display:block;max-width:100%;max-height:160px;border-radius:10px;object-fit:contain}
.banner .thumb{max-height:110px;max-width:90px}
.thumb.lg{max-height:300px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{appearance:none;padding:9px 14px;border:0;border-radius:999px;background:var(--surface-2);color:var(--fg);font:500 15px/1.2 var(--f-body);cursor:pointer}
.chip-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sw{display:inline-flex;align-items:center;flex:none;cursor:pointer}
.sw input[type="checkbox"]{appearance:none;-webkit-appearance:none;position:relative;width:51px;height:31px;margin:0;border:0;border-radius:16px;background:var(--surface-2);cursor:pointer;transition:background .2s;box-shadow:none}
.sw input[type="checkbox"]::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--knob);box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.sw input[type="checkbox"]:checked{background:var(--ok)}
.sw input[type="checkbox"]:checked::before{transform:translateX(20px)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,9.5rem) auto;gap:8px;align-items:end}
.lrow .icbtn{margin-bottom:6px}
.lbox{display:grid;gap:12px}

/* lists: management, settings, money */
.frow{display:flex;align-items:center;gap:12px;padding:12px 16px}
.frow-main{appearance:none;flex:1;min-width:0;display:grid;gap:2px;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.frow-main b{font-size:17px;font-weight:600}
.frow-main .s{color:var(--muted);font-size:14px}
.frow-main .s.attn{color:var(--attn);font-weight:500}
.frow-main .s.bad{color:var(--bad);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{padding:3px 9px;border-radius:999px;background:var(--surface-2);font-size:13px}
.add{appearance:none;display:flex;align-items:center;gap:10px;width:100%;padding:15px 16px;border:0;background:none;color:var(--accent);font:500 16px/1.2 var(--f-body);text-align:left;cursor:pointer}
.nrow{appearance:none;display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:12px 16px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.nrow > span:first-child{flex:1;min-width:0}
.nrow .v{color:var(--muted);font-size:15px;text-align:right;white-space:nowrap}
.nrow .v.strong{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.nrow .s{display:block;color:var(--muted);font-size:14px}
.nrow .s.attn{color:var(--attn);font-weight:500}
.nrow .s.bad{color:var(--bad);font-weight:500}
.nrow .dot{margin-right:-2px}
.switcher{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;margin-top:16px}
.switcher .mid{min-width:0;text-align:center}
.switcher .mid b{display:block;font-size:18px;font-weight:600}
.switcher .mid span{display:block;color:var(--muted);font-size:14px}
.switcher .mid .tbtn{padding:4px 6px;font-size:14px}
.switcher .icbtn{width:42px;height:42px}
.hero{margin-top:18px;padding:20px 18px;border-radius:20px;background:var(--surface)}
.hero .k{color:var(--muted);font-size:15px}
.hero .v{display:block;margin-top:6px;font:700 40px/1.05 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .c{display:block;margin-top:8px;color:var(--muted);font-size:15px}
.hero .c + .c{margin-top:4px}
.hero .tbtn{padding:6px 0 0;font-size:15px}
.brow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;font-size:16px}
.brow .v{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.brow small{display:block;color:var(--muted);font-size:14px}
.brow small.attn{color:var(--attn);font-weight:500}
.brow.total{font-weight:600}
.brow.total .v{font-weight:700}
button.brow{appearance:none;width:100%;border:0;background:none;color:inherit;font:inherit;font-size:16px;text-align:left;cursor:pointer}
button.brow .v{display:inline-flex;align-items:center;gap:6px}
.mrow{appearance:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:12px 16px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.mrow .d{min-width:46px;color:var(--muted);font-size:14px;line-height:1.3;font-variant-numeric:tabular-nums}
.mrow .m{min-width:0}
.mrow .m b{display:block;overflow:hidden;font-weight:500;text-overflow:ellipsis;white-space:nowrap}
.mrow .m span{display:block;overflow:hidden;color:var(--muted);font-size:14px;text-overflow:ellipsis;white-space:nowrap}
.mrow .a{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mrow .a small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.mrow .a small.bad{color:var(--bad)}
.mrow .a small.attn{color:var(--attn)}
.mrow .a small.ok{color:var(--ok)}
.back{appearance:none;display:inline-flex;align-items:center;gap:4px;margin:12px 0 0 -4px;padding:6px 4px;border:0;background:none;color:var(--accent);font:500 16px/1.2 var(--f-body);cursor:pointer}
.back svg{width:18px;height:18px}
.evo{display:grid;gap:12px;padding:14px 16px}
.evo-r{display:grid;grid-template-columns:3.2rem minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.evo-r .b{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.evo-r .b i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.evo-r .b i.neg{background:var(--bad)}
.evo-r .v{min-width:5.6rem;text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.evo-r.cur{font-weight:600}

/* agenda */
.issues{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.issue{appearance:none;padding:9px 14px;border:0;border-radius:999px;background:color-mix(in srgb,var(--attn) 15%,transparent);color:var(--attn);font:500 15px/1.2 var(--f-body);cursor:pointer}
.calm{margin-top:14px;color:var(--muted);font-size:15px}
.board{margin-top:16px;background:var(--surface);border-radius:16px;overflow:hidden}
.axis{position:relative;height:32px;margin:0 16px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.axis span{position:absolute;top:10px;transform:translateX(-50%)}
.board > * + *{border-top:1px solid var(--line)}
.lane > summary{list-style:none;display:grid;gap:9px;padding:14px 16px;cursor:pointer}
.lane > summary::-webkit-details-marker{display:none}
.ln-top{display:flex;align-items:center;gap:10px}
.ln-top b{font-size:17px;font-weight:600}
.ln-top .meta{margin-left:auto;color:var(--muted);font-size:14px}
.ln-top .chev{transition:transform .15s}
.lane[open] .ln-top .chev{transform:rotate(90deg)}
.bar{position:relative;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{position:absolute;height:10px;border-radius:5px;background:var(--accent)}
.bar i.p{background:var(--olive)}
.bar i.w{background:var(--attn)}
.bar i.done{opacity:.4}
.bar i.open{background:transparent;box-shadow:inset 0 0 0 2px var(--attn)}
.bar i.un{top:0;height:100%;border-radius:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 45%,transparent) 0 3px,transparent 3px 7px)}
.bar .now{position:absolute;top:0;bottom:0;width:2px;background:var(--fg)}
.ln-flags{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
.ln-flags .w{color:var(--attn);font-weight:500}
.ln-flags .m{color:var(--muted)}
.ln-body{padding:0 16px 10px}
.prow{appearance:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.prow .tr{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.prow .ds{min-width:0;overflow:hidden;font-size:15px;text-overflow:ellipsis;white-space:nowrap}
.prow .ds small{display:block;overflow:hidden;color:var(--muted);font-size:13px;text-overflow:ellipsis}
.cf{padding:0 0 10px;color:var(--attn);font-size:14px;font-weight:500}
.free{padding:14px 16px;color:var(--muted);font-size:15px}
.free b{color:var(--fg);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 4px 0;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:16px;height:8px;margin-right:6px;border-radius:4px;background:var(--accent);vertical-align:middle}
.legend i.p{background:var(--olive)}
.legend i.w{background:var(--attn)}
.legend i.un{border-radius:0;background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 5px)}
.money-tg{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:0 4px;color:var(--muted);font-size:15px}
.cal{margin-top:16px;padding:8px;border-radius:16px;background:var(--surface)}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-h span{padding:6px 0 4px;text-align:center;color:var(--muted);font-size:13px}
.cal-g button{appearance:none;position:relative;display:grid;justify-items:center;align-content:start;gap:5px;min-height:56px;padding:9px 2px 6px;border:0;border-radius:10px;background:none;color:var(--fg);font:500 16px/1 var(--f-body);font-variant-numeric:tabular-nums;cursor:pointer}
.cal-g button.out{opacity:.35}
.cal-g button.today .dn{color:var(--accent);font-weight:700}
.cal-g button[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-g .cn{min-width:22px;padding:2px 5px;border-radius:7px;background:var(--surface-2);color:var(--fg);font:600 12px/1.2 var(--f-body)}
.cal-g button[aria-pressed="true"] .cn{background:var(--bg)}
.cal-g .ad{position:absolute;top:7px;right:calc(50% - 15px);width:6px;height:6px;border-radius:50%;background:var(--attn)}
.daysum{margin:4px 4px 0;color:var(--muted);font-size:14px}

/* chooser, reading, sheet image */
.opt{appearance:none;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:14px 16px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.opt svg.ic{width:24px;height:24px;color:var(--accent);justify-self:center}
.opt b{display:block;font-size:17px;font-weight:600}
.opt small{display:block;color:var(--muted);font-size:14px}
.opt:disabled{opacity:.45;cursor:not-allowed}
.reading{display:grid;gap:18px;justify-items:center;padding-top:16px;text-align:center}
.reading p{margin:0;max-width:34ch;color:var(--muted)}
.loadbar{width:100%;max-width:260px;height:3px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.loadbar span{display:block;width:35%;height:100%;background:var(--accent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.ssimg{display:block;width:100%;border-radius:12px;background:var(--surface)}
pre.sel{margin:8px 0 0;padding:12px 14px;border-radius:12px;background:var(--surface);font:14px/1.5 var(--f-body);white-space:pre-wrap;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);padding:11px 18px;border-radius:999px;background:var(--fg);color:var(--bg);box-shadow:var(--shadow);font-size:15px;font-weight:500;text-align:center;transform:translateX(-50%)}
body.has-fab .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
html.locked .toast{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){.sheet,.loadbar span{animation:none}.ln-top .chev,.more > summary::after,.sw input::before{transition:none}}
</style>

<script>
(function(){
'use strict';
var LS='despacho-proto-v1';

function nowISO(){return new Date().toISOString();}
function clock(iso){var d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes());}
function mins(t){var m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?(+m[1])*60+(+m[2]):null;}
function fmt(ds,o){var p=ds.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('pt-PT',o);}
function cap(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1);}
function dayShort(ds){if(!ds)return 'Sem data';var t=today();if(ds===t)return 'Hoje';if(ds===addDays(t,1))return 'Amanhã';if(ds===addDays(t,-1))return 'Ontem';return cap(fmt(ds,{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,''));}
function dayLong(ds){if(!ds)return 'Sem data';return cap(fmt(ds,{weekday:'long',day:'numeric',month:'long'}));}
function dayFull(ds){var t=today();var l=fmt(ds,{weekday:'long',day:'numeric',month:'long'});if(ds===t)return 'Hoje, '+l;if(ds===addDays(t,1))return 'Amanhã, '+l;return cap(l);}
var MSH=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function dmy(ds){var p=ds.split('-').map(Number);return p[2]+' '+MSH[p[1]-1];}
function dmyy(ds){var p=ds.split('-').map(Number);return p[2]+' '+MSH[p[1]-1]+' '+p[0];}
function monthOf(ds){return ds.slice(0,7);}
function addMonths(ym,n){var p=ym.split('-').map(Number);var d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function monthName(ym){var p=ym.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('pt-PT',{month:'long'});}
function monthShort(ym){var p=ym.split('-').map(Number);return cap(new Date(p[0],p[1]-1,1).toLocaleDateString('pt-PT',{month:'short'}).replace(/\./g,''));}
function monthLabel(ym){var p=ym.split('-').map(Number);return cap(new Date(p[0],p[1]-1,1).toLocaleDateString('pt-PT',{month:'long',year:'numeric'}));}
function lastDay(ym){var p=ym.split('-').map(Number);return isoDate(new Date(p[0],p[1],0));}
function weekStart(ds){var p=ds.split('-').map(Number);var wd=(new Date(p[0],p[1]-1,p[2]).getDay()+6)%7;return addDays(ds,-wd);}
function dayDiff(a,b){var p=a.split('-').map(Number),q=b.split('-').map(Number);return Math.round((Date.UTC(q[0],q[1]-1,q[2])-Date.UTC(p[0],p[1]-1,p[2]))/86400000);}
function grp(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0');}
function eur(v){var c=Math.round(Math.abs(Number(v)||0)*100),neg=(Number(v)||0)<0&&c>0;return (neg?'−':'')+grp(Math.floor(c/100))+','+pad(c%100)+'\u00A0€';}
function eur0(v){var n=Math.round(Number(v)||0);return (n<0?'−':'')+grp(Math.abs(n))+'\u00A0€';}
function pctTxt(v){return (v*100).toLocaleString('pt-PT',{maximumFractionDigits:0})+' %';}
function blank(v){return v===''||v==null;}
function plural(n,one,many){return n+' '+(n===1?one:many);}
function r2(x){return Math.round((Number(x)||0)*100)/100;}
function num(v,d){var n=Number(v);return blank(v)||!isFinite(n)?d:n;}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function sumAmt(a){return (a||[]).reduce(function(x,y){return x+Number(y.amount||0);},0);}
function nowAbs(){var n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/60000+n.getHours()*60+n.getMinutes();}
function gmaps(a){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a);}
function waze(a){return 'https://waze.com/ul?q='+encodeURIComponent(a)+'&navigate=yes';}
function isAirport(a){return /aeroporto|airport|humberto delgado|\bLIS\b|terminal\s*[12]\b/i.test(a||'');}

  r.received=r2(sumAmt(s.receipts));r.toReceive=Math.max(0,r2(r.saleGross-r.received));
  r.paidOut=r2(sumAmt(s.payouts));r.toPay=ext?Math.max(0,r2(r.costGross-r.paidOut)):0;
  r.billable=isBillable(s);r.payable=isPayable(s);
  r.due=dueDate(s);r.overdue=r.billable&&r.toReceive>0.004&&!!r.due&&today()>r.due;

}
function invoiced(s){return !!(s.invoice&&s.invoice.no);}
function finClosed(s,f){f=f||fin(s);if(!(f.billable||f.payable)||f.prov)return false;return f.toReceive<=0.004&&f.toPay<=0.004&&(!f.saleGross||invoiced(s));}

/* ---------- documents, maintenance, capacity ---------- */
function docState(x){
  if(!x||!x.expiry)return null;var d=dayDiff(today(),x.expiry);
  if(d<0)return {k:'bad',d:d,txt:'expirou a '+dmy(x.expiry)};
  if(d<=30)return {k:'attn',d:d,txt:d===0?'expira hoje':d===1?'expira amanhã':'expira em '+d+' dias'};
  return {k:'ok',d:d,txt:'válido até '+dmyy(x.expiry)};
}
function docIssues(o){return ((o&&o.docs)||[]).map(function(x){var st=docState(x);return st&&st.k!=='ok'?{doc:x,st:st}:null;}).filter(Boolean);}
function docsExpiredAt(o,date){return ((o&&o.docs)||[]).filter(function(x){return x.expiry&&date&&x.expiry<date;});}
function vBlockOn(v,date){return (v&&date&&(v.blocks||[]).filter(function(b){return b.from&&b.from<=date&&date<=(b.to||b.from);})[0])||null;}
function blockLabel(b){return !b.to||b.from===b.to?dmy(b.from):dmy(b.from)+' a '+dmy(b.to);}
function capIssues(s,v){
  v=v||veh(s.vehicleId);if(!v||isExt(s))return [];
  var out=[],pax=num(s.pax,0),bg=bagsOf(s);
  if(v.seats&&pax>v.seats)out.push(plural(pax,'passageiro','passageiros')+' para '+v.seats+' lugares no '+v.name+'.');
  if(v.bags&&bg>v.bags)out.push(plural(bg,'mala','malas')+' para '+v.bags+' de capacidade de bagagem no '+v.name+'.');
  return out;
}

/* ---------- who can do what ----------
   A missing list means no restriction: the driver drives every vehicle, does every type; the vehicle serves every type. */
function allows(list,x){return !Array.isArray(list)||!x||list.indexOf(x)>-1;}
function typeTxt(t){return 'serviços do tipo '+t;}
function fitIssues(s,d,v){
  var out=[];if(isExt(s))return out;
  if(d&&!allows(d.types,s.event))out.push(d.name+' não faz '+typeTxt(s.event)+'.');
  if(d&&v&&!allows(d.vehicles,v.id))out.push(d.name+' não conduz o '+v.name+'.');
  if(v&&!allows(v.types,s.event))out.push('O '+v.name+' não serve para '+typeTxt(s.event)+'.');
  return out;
}

/* ---------- time occupancy, overlaps, days off ---------- */
function durOf(s){var a=mins(s.time),e=mins(s.end);if(a!=null&&e!=null){var d=e-a;if(d<=0)d+=1440;return d;}var d2=parseInt(s.dur,10);if(isFinite(d2)&&d2>0)return d2;return s.event?typeDur(s.event):S.settings.defaultDur;}
function waitOf(s){var w=parseInt(s.wait,10);return isFinite(w)&&w>=0?w:S.settings.wait;}
function startAbs(s){var m=mins(s.time);if(!s.date||m==null)return null;var p=s.date.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])/60000+m;}
function endAbs(s){var a=startAbs(s);return a==null?null:a+durOf(s);}
function hm(abs){var m=((abs%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);}
function endLabel(s){var a=startAbs(s);return a==null?'':hm(a+durOf(s));}
function fmtMin(m){if(m<60)return m+' min';var h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+r+' min':'');}
function busyFor(o){return !isExt(o)&&o.status!=='cancelado'&&o.status!=='recusado';}
function overlaps(svc,field,id){
  var a=startAbs(svc);if(a==null||!id||isExt(svc))return [];
  var aEnd=a+durOf(svc),buf=+S.settings.buffer||0;
  return S.services.filter(function(o){return o.id!==svc.id&&o[field]===id&&busyFor(o);}).map(function(o){
    var b=startAbs(o);if(b==null)return null;var bEnd=b+durOf(o);
    var ov=Math.min(aEnd,bEnd)-Math.max(a,b);
    if(ov>0)return {o:o,kind:'overlap',min:ov,a:a,aEnd:aEnd,b:b,bEnd:bEnd};
    var after=b>=aEnd,gap=after?b-aEnd:a-bEnd;
    if(gap<buf)return {o:o,kind:'tight',min:gap,a:a,aEnd:aEnd,b:b,bEnd:bEnd,after:after};
    return null;
  }).filter(Boolean).sort(function(x,y){return x.b-y.b;});
}
function overlapText(x,who){
  var o=x.o,ref=o.ref||'outro serviço',typ=o.event?' ('+o.event.toLowerCase()+')':'';
  var gap=x.min<=0?'sem intervalo nenhum':'só '+fmtMin(x.min)+' de intervalo';
  if(x.kind==='overlap')return cap(who+' tem '+ref+typ+' das '+hm(x.b)+' às '+hm(x.bEnd)+', aproximadamente. Sobrepõe-se cerca de '+fmtMin(x.min)+'.');
  if(x.after)return 'Este serviço acaba por volta das '+hm(x.aEnd)+' e '+who+' tem '+ref+typ+' às '+hm(x.b)+': fica '+gap+'.';
  return cap(who+' acaba '+ref+typ+' por volta das '+hm(x.bEnd)+' e este começa às '+hm(x.a)+': fica '+gap+'.');
}
function isOv(x){return x.kind==='overlap';}
function unWin(u){return u.from&&u.to?{a:mins(u.from),e:mins(u.to)}:{a:0,e:1440};}
function unLabel(u){return u.from&&u.to?u.from+'–'+u.to:'todo o dia';}
function unavailFor(dId,svc){
  var a=mins(svc.time);if(!dId||!svc.date||a==null)return [];var e=a+durOf(svc);
  return S.unavail.filter(function(u){if(u.driverId!==dId||u.date!==svc.date)return false;var w=unWin(u);return w.a<e&&a<w.e;});
}
function unavText(u,name){return name+' marcou que não está disponível '+(u.from&&u.to?'das '+u.from+' às '+u.to:'neste dia')+(u.note?' ('+u.note.toLowerCase()+')':'')+'.';}
function docAdvice(o,date){return docsExpiredAt(o,date).map(function(x){return o.name+': '+x.type.toLowerCase()+(x.expiry<today()?' expirou a ':' expira a ')+dmy(x.expiry)+(x.expiry<today()?'.':', antes deste serviço.');});}
function serviceAdvice(s){
  var out=[];
  if(isExt(s)||['cancelado','recusado','concluido','no_show'].indexOf(s.status)>-1)return out;
  var d=drv(s.driverId),v=veh(s.vehicleId);
  fitIssues(s,d,v).forEach(function(t){out.push(t);});
  if(d){
    if(!d.on)out.push(d.name+' está marcado como indisponível.');
    unavailFor(d.id,s).forEach(function(u){out.push(unavText(u,d.name));});
    overlaps(s,'driverId',d.id).forEach(function(x){out.push(overlapText(x,d.name));});
    docAdvice(d,s.date).forEach(function(t){out.push(t);});
  }
  if(v){
    var b=vBlockOn(v,s.date);if(b)out.push(v.name+' está em manutenção '+(!b.to||b.from===b.to?'neste dia':'de '+blockLabel(b))+(b.reason?' ('+b.reason.toLowerCase()+')':'')+'.');
    if(!v.on)out.push(v.name+' está marcado como indisponível.');
    overlaps(s,'vehicleId',v.id).forEach(function(x){out.push(overlapText(x,'o '+v.name));});
    capIssues(s,v).forEach(function(t){out.push(t);});
    docAdvice(v,s.date).forEach(function(t){out.push(t);});
    if(s.vtype&&v.cat!==s.vtype)out.push('Foi pedido '+s.vtype+' e o veículo é '+v.name+' ('+v.cat+').');
  }
  return out;
}
function conflictOf(s){
  if(isExt(s)||['cancelado','recusado','concluido','no_show'].indexOf(s.status)>-1)return null;
  var ov=overlaps(s,'driverId',s.driverId).concat(overlaps(s,'vehicleId',s.vehicleId));
  if(ov.some(isOv))return 'Sobreposição';
  if(s.driverId&&unavailFor(s.driverId,s).length)return 'Driver de folga';
  if(fitIssues(s,drv(s.driverId),veh(s.vehicleId)).length)return 'Não compatível';
  var v=veh(s.vehicleId),d=drv(s.driverId);
  if(v&&vBlockOn(v,s.date))return 'Em manutenção';
  if(docsExpiredAt(d,s.date).length||docsExpiredAt(v,s.date).length)return 'Documento expirado';
  if(v&&capIssues(s,v).length)return 'Capacidade';
  if(ov.length)return 'Intervalo curto';
  return null;
}
function adviceBlock(arr){
  if(!arr.length)return '';
  return '<details class="notice"><summary>'+(arr.length===1?'1 aviso':arr.length+' avisos')+'</summary>'+arr.map(function(t){return '<p>'+esc(t)+'</p>';}).join('')+'<p class="hint">A decisão é tua. Podes manter e enviar na mesma.</p></details>';
}
function busyLabel(ov){if(!ov.length)return '';var o=ov.filter(isOv)[0];return o?', ocupado '+hm(o.b)+'–'+hm(o.bEnd):', intervalo curto';}
/* Why a driver or a vehicle cannot take this service right now; empty when it can. */
function drvBlock(x,s){
  if(!x.on)return 'indisponível';
  if(!allows(x.types,s.event))return 'não faz este tipo';
  if(unavailFor(x.id,s).length)return 'de folga';
  if(docsExpiredAt(x,s.date).length)return 'documento expirado';
  var v=veh(s.vehicleId);if(v&&!allows(x.vehicles,v.id))return 'não conduz o '+v.name;
  var o=overlaps(s,'driverId',x.id).filter(isOv)[0];if(o)return 'ocupado '+hm(o.b)+'–'+hm(o.bEnd);
  return '';
}
function vehBlock(x,s){
  if(!x.on)return 'indisponível';
  if(vBlockOn(x,s.date))return 'em manutenção';
  if(docsExpiredAt(x,s.date).length)return 'documento expirado';
  if(!allows(x.types,s.event))return 'não serve para este tipo';
  var d=drv(s.driverId);if(d&&!allows(d.vehicles,x.id))return d.name+' não conduz';
  if(capIssues(s,x).length)return 'pouca capacidade';
  var o=overlaps(s,'vehicleId',x.id).filter(isOv)[0];if(o)return 'ocupado '+hm(o.b)+'–'+hm(o.bEnd);
  return '';
}
function optLabelD(x,svc){var b=drvBlock(x,svc);return x.name+(b?', '+b:overlaps(svc,'driverId',x.id).length?', intervalo curto':'');}
function optLabelV(x,svc){var b=vehBlock(x,svc);return x.name+(b?', '+b:overlaps(svc,'vehicleId',x.id).length?', intervalo curto':svc.vtype&&x.cat!==svc.vtype?', é '+x.cat:'');}
function dayLoad(dId,s){return S.services.filter(function(o){return o.id!==s.id&&o.driverId===dId&&o.date===s.date&&!isExt(o)&&busyFor(o);}).length;}
/* Best free, qualified driver and vehicle for a service. Keeps what is already chosen, skips whoever refused it.
   Prefers: the vehicle category asked for, no tight gaps, the driver's usual vehicle, the lighter day, the smallest vehicle that fits. */
function suggest(s){
  if(isExt(s)||!s.date)return null;
  var refused=s.status==='recusado'?(s.declinedBy||s.driverId):'';
  var fixD=s.driverId&&s.driverId!==refused?s.driverId:'',fixV=refused?'':(s.vehicleId||'');
  var best=null;
  live(S.drivers).forEach(function(d){
    if(d.id===refused||(fixD&&d.id!==fixD))return;
    var probe=Object.assign({},s,{driverId:'',vehicleId:''});
    if(drvBlock(d,probe))return;
    var ds=(overlaps(s,'driverId',d.id).length?20:0)+dayLoad(d.id,s)*3;
    live(S.vehicles).forEach(function(v){
      if(fixV&&v.id!==fixV)return;
      if(!allows(d.vehicles,v.id)||vehBlock(v,probe))return;
      var vs=(s.vtype&&v.cat!==s.vtype?30:0)+(overlaps(s,'vehicleId',v.id).length?20:0)+(d.home===v.id?-8:0)+Math.max(0,(+v.seats||0)-num(s.pax,1))*0.5;
      if(!best||ds+vs<best.sc)best={d:d,v:v,sc:ds+vs};
    });
  });
  if(!best)return null;
  var why=[],n=dayLoad(best.d.id,s),tight=overlaps(s,'driverId',best.d.id).length||overlaps(s,'vehicleId',best.v.id).length;
  why.push(tight?'Livre, mas com intervalo curto':'Livre a essa hora');
  why.push(n?plural(n,'outro serviço','outros serviços')+' nesse dia':'sem outros serviços nesse dia');
  if(best.d.home===best.v.id)why.push('é o veículo habitual de '+best.d.name);
  if(s.vtype&&best.v.cat!==s.vtype)why.push('foi pedido '+s.vtype+', este é '+best.v.cat);
  best.why=cap(why.join(', '))+'.';
  return best;
}
function sugLabel(g){return g.d.name+' com o '+g.v.name;}

/* ---------- what drivers can see ---------- */
function driverOwns(s,me){if(isExt(s)||s.driverId!==me)return false;if(DRV_ST.indexOf(s.status)>-1)return true;return s.status==='cancelado'&&!!s.sentAt;}
function driverVisible(s,me){return s.date>=today()&&driverOwns(s,me);}
function withdrawnFor(s,me){return s.date>=today()&&(s.former||[]).indexOf(me)>-1&&(s.formerAck||[]).indexOf(me)<0&&!driverOwns(s,me);}
function takeFrom(s,dId){
  if(!dId||!s.sentAt)return;
  s.former=s.former||[];if(s.former.indexOf(dId)<0)s.former.push(dId);
  s.formerAck=(s.formerAck||[]).filter(function(x){return x!==dId;});

}

/* ---------- to-do lists and alerts ---------- */
function todoLists(){
  var t=today(),now=nowAbs();
  var fechar=S.services.filter(function(s){
    var e=endAbs(s);if(e==null||now<=e+120)return false;
    return ACTIVE.indexOf(s.status)>-1||((s.status==='pendente'||s.status==='recusado')&&s.date<t);
  }).sort(byWhen);
  var fx={};fechar.forEach(function(s){fx[s.id]=1;});
  var up=S.services.filter(function(s){return s.date>=t&&!fx[s.id];}).sort(byWhen);
  return {

    fechar:fechar
  };
}
function todoCount(td){return td.alocar.length+td.recus.length+td.enviar.length+td.fechar.length;}
function alertsList(){
  var out=[],t=today(),lim=addDays(t,7);
  S.services.filter(function(s){return s.date>=t&&s.date<=lim&&!isExt(s)&&DRV_ACTIVE.indexOf(s.status)>-1;}).sort(byWhen).forEach(function(s){
    var c=conflictOf(s);if(c&&c!=='Intervalo curto')out.push({k:'svc',id:s.id,c:'attn',t:c+', '+s.ref,s:dayShort(s.date)+' às '+s.time+'. '+shortPlace(s.pickup)+' para '+shortPlace(s.dropoff)+'.'});
  });
  live(S.drivers).forEach(function(d){docIssues(d).forEach(function(x){out.push({k:'drv',id:d.id,c:x.st.k,t:d.name+': '+x.doc.type.toLowerCase(),s:cap(x.st.txt)+'.'});});});
  live(S.vehicles).forEach(function(v){
    docIssues(v).forEach(function(x){out.push({k:'veh',id:v.id,c:x.st.k,t:v.name+': '+x.doc.type.toLowerCase(),s:cap(x.st.txt)+'.'});});
    var nb=(v.blocks||[]).filter(function(b){return (b.to||b.from)>=t&&b.from<=addDays(t,7);})[0];
    if(nb)out.push({k:'veh',id:v.id,c:'info',t:v.name+' em manutenção',s:cap(blockLabel(nb))+(nb.reason?'. '+nb.reason+'.':'.')});
  });
  if(canMoney()){balances().debtors.filter(function(d){return d.overdue>0.004;}).forEach(function(d){out.push({k:d.pid?'prt':'deb',id:d.pid||d.key,c:'bad',t:d.name+': '+eur(d.overdue)+' em atraso',s:'Pagamento a '+plural(d.terms,'dia','dias')+' depois da fatura.'});});}
  return out;
}

/* ---------- periods and totals ---------- */
function periodRange(f){
  if(f.per==='dia')return [f.anchor,f.anchor];
  if(f.per==='semana'){var a=weekStart(f.anchor);return [a,addDays(a,6)];}
  if(f.per==='mes'){var ym=monthOf(f.anchor);return [ym+'-01',lastDay(ym)];}
  if(f.per==='ano'){var y=f.anchor.slice(0,4);return [y+'-01-01',y+'-12-31'];}
  var fr=f.from||f.anchor,to=f.to||fr;return fr<=to?[fr,to]:[to,fr];
}
function shiftPeriod(f,d){
  if(f.per==='dia')f.anchor=addDays(f.anchor,d);
  else if(f.per==='semana')f.anchor=addDays(f.anchor,7*d);
  else if(f.per==='mes')f.anchor=addMonths(monthOf(f.anchor),d)+'-01';
  else if(f.per==='ano')f.anchor=(Number(f.anchor.slice(0,4))+d)+'-01-01';
  else{var r=periodRange(f),len=dayDiff(r[0],r[1])+1;f.from=addDays(r[0],d*len);f.to=addDays(r[1],d*len);}
}
function periodLabel(f){
  var r=periodRange(f);
  if(f.per==='dia')return [dayShort(r[0]),dayLong(r[0])];
  if(f.per==='semana')return ['Semana de '+dmy(r[0]),dmy(r[0])+' a '+dmy(r[1])];
  if(f.per==='mes')return [monthLabel(monthOf(r[0])),''];
  if(f.per==='ano')return [r[0].slice(0,4),''];
  return [dmy(r[0])+' a '+dmy(r[1]),'Datas escolhidas'];
}
function ffActive(){var F=ui.ff;return !!(F.partner||F.driver||F.vehicle||F.type);}
function finMatch(s){
  var F=ui.ff;
  if(F.partner&&!((s.origin==='partner'&&s.originPartnerId===F.partner)||(isExt(s)&&s.execPartnerId===F.partner)))return false;
  if(F.driver&&(isExt(s)||s.driverId!==F.driver))return false;
  if(F.vehicle&&(isExt(s)||s.vehicleId!==F.vehicle))return false;
  if(F.type&&s.event!==F.type)return false;
  return true;
}
function expDate(x){return x.at?isoDate(new Date(x.at)):'';}
function aggregate(from,to){
  var t=today(),A={n:0,future:0,saleNet:0,saleVat:0,saleGross:0,cost:0,pay:0,exp:0,margin:0,prov:[],invoiced:0,list:[],done:0,ns:0,canc:0};
  S.services.forEach(function(s){
    if(!s.date||s.date<from||s.date>to||!finMatch(s))return;
    if(s.status==='cancelado')A.canc++;
    var f=fin(s);if(!f.counts)return;
    A.n++;A.list.push(s);
    if(DONE.indexOf(s.status)>-1){A.done++;if(s.status==='no_show')A.ns++;}
    else if(s.status!=='cancelado')A.future++;
    A.saleNet+=f.saleNet;A.saleVat+=f.saleVat;A.saleGross+=f.saleGross;A.cost+=f.costM;A.pay+=f.pay;A.exp+=f.exp;A.margin+=f.margin;
    if(f.prov)A.prov.push(s);
    if(invoiced(s))A.invoiced+=f.saleGross;
  });
  var F=ui.ff;A.genOK=!(F.partner||F.driver||F.type);A.gen=0;A.genList=[];
  if(A.genOK)S.genExp.forEach(function(g){if(g.date<from||g.date>to)return;if(F.vehicle&&g.vehicleId!==F.vehicle)return;A.gen+=Number(g.amount||0);A.genList.push(g);});
  A.result=A.margin-A.gen;
  A.inCash=0;A.outPartners=0;A.outDrivers=0;A.outExp=0;
  S.services.forEach(function(s){
    if(!finMatch(s))return;
    (s.receipts||[]).forEach(function(x){if(x.date>=from&&x.date<=to)A.inCash+=Number(x.amount||0);});
    (s.payouts||[]).forEach(function(x){if(x.date>=from&&x.date<=to)A.outPartners+=Number(x.amount||0);});
    (s.expenses||[]).forEach(function(x){if(x.paidBy!=='empresa')return;var d=expDate(x);if(d>=from&&d<=to)A.outExp+=Number(x.amount||0);});
  });
  if(!(F.partner||F.vehicle||F.type))S.driverPays.forEach(function(p){if(F.driver&&p.driverId!==F.driver)return;if(p.date>=from&&p.date<=to)A.outDrivers+=Number(p.amount||0);});
  if(A.genOK)A.outExp+=A.gen;
  A.cash=A.inCash-A.outPartners-A.outDrivers-A.outExp;
  ['saleNet','saleVat','saleGross','cost','pay','exp','margin','gen','result','invoiced','inCash','outPartners','outDrivers','outExp','cash'].forEach(function(k){A[k]=r2(A[k]);});
  A.list.sort(byWhen);
  return A;
}
function driverEarned(dId,from,to){
  var o={n:0,ns:0,van:0,car:0,pay:0,noPay:0,ex:0,list:[]};
  S.services.forEach(function(s){
    if(isExt(s)||s.driverId!==dId||DONE.indexOf(s.status)<0)return;
    if(from&&s.date<from)return;if(to&&s.date>to)return;
    o.n++;o.list.push(s);if(s.status==='no_show')o.ns++;if(isVan(s))o.van++;else o.car++;
    var p=payOf(s);if(p==null)o.noPay++;else o.pay+=p;o.ex+=expDriver(s);
  });

function driverPaid(dId,from,to){return r2(S.driverPays.filter(function(p){return p.driverId===dId&&(!from||p.date>=from)&&(!to||p.date<=to);}).reduce(function(a,p){return a+Number(p.amount||0);},0));}
function driverBalance(dId){return r2(driverEarned(dId,'',today()).total-driverPaid(dId,'',''));}
function balances(){
  var deb={},cre={},R=0,OV=0,P=0,uninv=[];
  S.services.forEach(function(s){
    var f=fin(s);
    if(f.billable&&f.toReceive>0.004){
      var k=debtorKey(s),d=deb[k]||(deb[k]={key:k,pid:s.origin==='partner'?s.originPartnerId:'',name:billTo(s),terms:termsOf(s),total:0,overdue:0,list:[]});
      d.total+=f.toReceive;d.list.push(s);R+=f.toReceive;if(f.overdue){d.overdue+=f.toReceive;OV+=f.toReceive;}

    if(f.billable&&f.saleGross>0&&!invoiced(s))uninv.push(s);
  });
  function sorted(o){return Object.keys(o).map(function(k){var x=o[k];x.total=r2(x.total);if(x.overdue!=null)x.overdue=r2(x.overdue);x.list.sort(byWhen);return x;}).sort(function(a,b){return b.total-a.total;});}
  var D=0,drivers=S.drivers.map(function(d){return {id:d.id,name:d.name,removed:!!d.removed,bal:driverBalance(d.id)};}).filter(function(x){return !x.removed||Math.abs(x.bal)>0.004;});
  drivers.forEach(function(x){if(x.bal>0)D+=x.bal;});
  return {R:r2(R),OV:r2(OV),P:r2(P),D:r2(D),debtors:sorted(deb),creditors:sorted(cre),drivers:drivers,uninv:uninv.sort(byWhen)};

function partnerData(pid){
  var rec=S.services.filter(function(s){return s.origin==='partner'&&s.originPartnerId===pid;}).sort(byWhen).reverse();
  var del=S.services.filter(function(s){return isExt(s)&&s.execPartnerId===pid;}).sort(byWhen).reverse();
  var o={rec:rec,del:del,owe:0,ov:0,we:0,openR:[],openP:[],mv:[]};
  rec.forEach(function(s){var f=fin(s);if(f.billable&&f.toReceive>0.004){o.owe+=f.toReceive;if(f.overdue)o.ov+=f.toReceive;o.openR.push(s);}});
  del.forEach(function(s){var f=fin(s);if(f.payable&&f.toPay>0.004){o.we+=f.toPay;o.openP.push(s);}});
  o.owe=r2(o.owe);o.ov=r2(o.ov);o.we=r2(o.we);
  var g={};
  function add(kind,s,x){var k=kind+(x.batch||x.id);var e=g[k]||(g[k]={kind:kind,date:x.date,amount:0,method:x.method,ref:x.ref,n:0});e.amount=r2(e.amount+Number(x.amount||0));e.n++;}
  rec.forEach(function(s){(s.receipts||[]).forEach(function(x){add('in',s,x);});});
  del.forEach(function(s){(s.payouts||[]).forEach(function(x){add('out',s,x);});});
  var inv={};rec.forEach(function(s){if(!invoiced(s))return;var k=s.invoice.no,e=inv[k]||(inv[k]={kind:'inv',date:s.invoice.date,amount:0,ref:k,n:0});e.amount=r2(e.amount+fin(s).saleGross);e.n++;});
  o.mv=Object.keys(g).map(function(k){return g[k];}).concat(Object.keys(inv).map(function(k){return inv[k];})).sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  return o;
}
function allocate(list,amount,kind,meta){
  var left=r2(amount),batch=meta.batch||uid(),n=0;
  list.slice().sort(byWhen).forEach(function(s){
    if(left<=0.004)return;
    var f=fin(s),open=kind==='receipts'?f.toReceive:f.toPay;if(open<=0.004)return;
    var a=r2(Math.min(open,left));
    s[kind]=s[kind]||[];s[kind].push({id:uid(),date:meta.date,amount:a,method:meta.method,ref:meta.ref||'',by:S.role,batch:batch});
    log(s,kind==='receipts'?'recebimento':'pagamento',S.role,eur(a)+', '+meta.method.toLowerCase()+(meta.ref?', '+meta.ref:''),true);
    left=r2(left-a);n++;
  });
  return {used:r2(amount-left),left:left,n:n};
}

function matchQ(s,q){var w=norm(q).split(/\s+/).filter(Boolean);if(!w.length)return true;var tx=svcText(s);return w.every(function(x){return tx.indexOf(x)>-1;});}
function sfCount(){var F=ui.sf;return ['origin','exec','driver','vehicle','status'].filter(function(k){return !!F[k];}).length;}
function sfMatch(s){
  var F=ui.sf;
  if(F.origin){if(F.origin==='direct'){if(s.origin!=='direct')return false;}else if(!(s.origin==='partner'&&s.originPartnerId===F.origin))return false;}
  if(F.exec){if(F.exec==='int'){if(isExt(s))return false;}else if(!(isExt(s)&&s.execPartnerId===F.exec))return false;}

}

function agDay(){
  var A=ui.ag,ds=A.date,isD=A.by!=='veh',field=isD?'driverId':'vehicleId',t0=today();

  var open=ints.filter(function(s){return !s[field];}).concat(exts.filter(function(s){return !s.execPartnerId;})).sort(byWhen);
  var lo=6*60,hi=24*60;
  day.forEach(function(s){var m=mins(s.time);if(m==null)return;lo=Math.min(lo,Math.floor(m/60)*60);hi=Math.max(hi,Math.ceil((m+durOf(s))/60)*60);});
  var nowM=null;if(ds===t0){var nd=new Date();nowM=nd.getHours()*60+nd.getMinutes();}

  var pIds=[];exts.forEach(function(s){if(s.execPartnerId&&pIds.indexOf(s.execPartnerId)<0)pIds.push(s.execPartnerId);});

    var H=Math.max(1,rows.length)*14+6;

      (un||[]).map(function(u){var w=unWin(u);return '<i class="un" style="left:'+pc(w.a)+';width:'+wpc(w.a,w.e)+'"></i>';}).join('')+
      bl.map(function(b){return '<i class="'+(cls||'')+(b.w?' w':'')+(DONE.indexOf(b.s.status)>-1?' done':'')+'" style="left:'+pc(b.a)+';width:'+(Math.max(b.e-b.a,12)/span*100).toFixed(2)+'%;top:'+(3+b.row*14)+'px"></i>';}).join('')+
      (nowM!=null&&nowM>lo&&nowM<hi?'<span class="now" style="left:'+pc(nowM)+'"></span>':'')+'</span>';
  }
  function rowsHTML(bl,noGap){

  function laneHTML(l){

var sheetAct={},sheetOnClose=null,lastFocus=null;
function openSheet(title,body,foot,acts,onClose){
  $('#sheetTitle').textContent=title;
  $('#sheetBody').innerHTML=body;
  var ft=$('#sheetFoot');ft.innerHTML=foot||'';ft.hidden=!foot;
  sheetAct=Object.assign({copy:doCopy},acts||{});
  sheetOnClose=onClose||null;
  ui.editor=null;
  var w=$('#sheetWrap');
  if(w.hidden){lastFocus=document.activeElement;w.hidden=false;document.documentElement.classList.add('locked');}
  $('#sheetBody').scrollTop=0;
  try{$('#sheetClose').focus({preventScroll:true});}catch(e){}
}
function closeSheet(){
  var w=$('#sheetWrap');if(w.hidden)return;
  w.hidden=true;document.documentElement.classList.remove('locked');
  var f=sheetOnClose;sheetOnClose=null;sheetAct={};ui.chooser=false;ui.editor=null;
  if(f)f();
  if(lastFocus&&lastFocus.focus&&document.contains(lastFocus)){try{lastFocus.focus({preventScroll:true});}catch(e){}}
}
function keepScroll(fn){var y=$('#sheetBody').scrollTop;fn();$('#sheetBody').scrollTop=y;}
$('#sheetClose').addEventListener('click',closeSheet);
$('#sheetWrap').addEventListener('click',function(e){

});

document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheetWrap').hidden)closeSheet();});
function doCopy(el){
  var v=el.dataset.copy;
  function fallback(){var t=($('#sheetBody')||document).querySelector('.sel');if(t){var r=document.createRange();r.selectNodeContents(t);var sl=window.getSelection();sl.removeAllRanges();sl.addRange(r);}toast('Texto selecionado. Copia pelo menu do telemóvel.');}

}

function applySetting(t){
  var k=t.dataset&&t.dataset.set;if(!k)return;
  var st=S.settings;
  if(k.indexOf('co:')===0){st.company[k.slice(3)]=t.value.trim();save();$('#brandName').textContent=st.company.name||'Despacho';return;}
  if(k.indexOf('pay:')===0){var c=k.slice(4);if(t.value===''){st.payByCat[c]='';}else{var pv=parseFloat(t.value);if(!isFinite(pv)||pv<0){t.value=st.payByCat[c];return;}st.payByCat[c]=pv;}st.payExample=false;save();return;}
  if(k==='vat'){st.vat=Number(t.value);save();return;}
  if(k.indexOf('type:')===0){var ty=st.types.find(function(x){return x.name===k.slice(5);}),n2=parseInt(t.value,10);if(!ty||!isFinite(n2)||n2<5){t.value=ty?ty.dur:'';return;}ty.dur=n2;save();return;}
  if(k.indexOf('mname:')===0){var m=master(k.slice(6));if(m&&t.value.trim()){m.name=t.value.trim();save();}return;}
  if(k.indexOf('mmoney:')===0){var m2=master(k.slice(7));if(m2&&!m2.admin){m2.money=t.checked;audit((t.checked?'Acesso às finanças dado a ':'Acesso às finanças retirado a ')+m2.name);save();}return;}
  if(k==='theme')return;
  var n=parseInt(t.value,10),cur=k==='def'?st.defaultDur:k==='buf'?st.buffer:k==='cterms'?st.clientTerms:st.wait;
  if(!isFinite(n)||n<0){t.value=cur;return;}
  if(k==='buf')st.buffer=n;else if(k==='wait')st.wait=n;else if(k==='cterms')st.clientTerms=n;else if(k==='def')st.defaultDur=Math.max(5,n);

function rulesList(list){

function openDeliver(s,back){

function openCancel(s,back){
  var cm=canMoney(),ext=isExt(s);
  var body='<p style="margin:0 0 16px">Cancelar '+esc(s.ref||'este serviço')+'?'+(s.sentAt?' O driver vê que foi cancelado.':'')+(ext&&s.status==='entregue'?' Avisa '+esc(pName(s.execPartnerId))+'.':'')+'</p>'+
    (cm?'<div style="display:grid;gap:14px"><div class="f"><label for="cx_fee">Taxa de cancelamento a cobrar (€, sem IVA)</label><input id="cx_fee" type="number" min="0" step="0.5" inputmode="decimal" placeholder="Sem taxa"></div>'+
      (ext?'<div class="f"><label for="cx_cost">Taxa a pagar a '+esc(pName(s.execPartnerId))+' (€, sem IVA)</label><input id="cx_cost" type="number" min="0" step="0.5" inputmode="decimal" placeholder="Sem taxa"></div>':'')+

  var E=ui.editor,d=collect(),errs={};

  if(d.originPartnerId==='_new')d.originPartnerId=newPartner($('#f_newOP').value.trim(),'gives');
  if(d.execPartnerId==='_new')d.execPartnerId=newPartner($('#f_newEP').value.trim(),'does');
  var ex=E.existing,s=ex?svcById(ex.id):null,msg;
  if(!s){
    s=Object.assign(blankSvc(),{id:uid(),history:[],status:'pendente',sentAt:null,seenByDriver:true,changedAt:null,declineReason:'',declinedBy:'',expenses:[],receipts:[],payouts:[],files:[],invoice:null,former:[],formerAck:[],prevStatus:'',src:E.src||'manual'});

  }

  Object.assign(s,d);

    if(ACTIVE.indexOf(prev.status)>-1){
      if(prev.exec==='int'&&(s.exec==='ext'||prev.driver!==s.driverId)){

        msg=s.exec==='ext'?'Guardado. Falta entregar ao parceiro.':'Guardado. Falta enviar ao novo driver.';
      }else if(execChanged){s.status='pendente';s.sentAt=null;msg='Guardado. Falta entregar.';}
      else if(s.exec==='int'){s.changedAt=nowISO();s.seenByDriver=false;log(s,'alterado',S.role);}

    }else if(s.status==='recusado'&&((s.exec==='int'&&s.driverId&&s.driverId!==(s.declinedBy||prev.driver))||s.exec==='ext')){s.status='pendente';s.sentAt=null;}

  }

  var deliverAfter=false;

  if(!past){
    if(s.status==='enviado')foot='<div class="row2"><button type="button" class="btn alt" data-act="decline">Recusar</button><button type="button" class="btn" data-act="go" data-to="aceite">Aceitar</button></div>';

/* ---------- expenses ---------- */
function downscale(file,max){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,(max||1000)/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);try{res(c.toDataURL('image/jpeg',0.72));}catch(e){rej(e);}};
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}

/* ---------- service sheet image + sharing ---------- */
var dlFn=null;
function saveFile(name,data){
  if(!dlFn){shareOrDownload(name,data);return;}
  dlFn.save({filename:name,data:data}).then(function(r){if(r&&r.status==='saved')toast('Ficheiro guardado');},function(e){var c=e&&e.code;if(c==='declined')return;toast(c==='rate_limited'?'Já há um pedido aberto. Tenta daqui a pouco.':'Não foi possível guardar o ficheiro.');});
}
function shareOrDownload(name,data){
  var type=/\.csv$/i.test(name)?'text/csv':/\.png$/i.test(name)?'image/png':'application/octet-stream';
  var blob=data instanceof Blob?data:new Blob([data],{type:type});
  try{
    var file=new File([blob],name,{type:type});
    if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(function(e){if(e&&e.name!=='AbortError')downloadBlob(blob,name);});return;}
  }catch(e){}
  downloadBlob(blob,name);
}
function downloadBlob(blob,name){
  try{var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove();},5000);toast('Ficheiro pronto');}
  catch(e){toast('Não foi possível criar o ficheiro.');}
}
function enDate(ds){return new Date(ds+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function shareText(s,mode){
  var v=veh(s.vehicleId),d=drv(s.driverId),co=S.settings.company,L=[],forP=mode==='partner';
  L.push('*SERVICE SHEET*'+(s.ref?' #'+s.ref:''));
  if(co.name)L.push(co.name);
  L.push('');
  L.push('Date: '+enDate(s.date));
  L.push('Pick-up time: '+(s.time||'—'));
  if(s.end)L.push('Estimated end: '+s.end);
  L.push('Service: '+(EVENTS_EN[s.event]||s.event||'Transfer'));
  L.push('');
  L.push('Passenger: '+(s.name||'—')+(blank(s.pax)?'':' ('+s.pax+' pax)'));
  if(s.phone)L.push('Phone: '+s.phone);
  var lug=[blank(s.checked)?'':s.checked+' checked',blank(s.cabin)?'':s.cabin+' cabin'].filter(Boolean).join(', ');
  if(lug)L.push('Luggage: '+lug);
  if(s.booster)L.push('Baby seat: yes');
  L.push('');
  L.push('Pick-up: '+(s.pickup||'—'));
  (s.stops||[]).forEach(function(x,i){L.push('Stop'+((s.stops.length>1)?' '+(i+1):'')+': '+x);});
  L.push('Drop-off: '+(s.dropoff||'—'));
  if(s.flight)L.push('Flight: '+s.flight);
  if(!forP&&!isExt(s)&&(v||d))L.push('');
  if(!forP&&!isExt(s)&&v)L.push('Vehicle: '+v.name+(v.plate?' ('+v.plate+')':''));
  if(!forP&&!isExt(s)&&d)L.push('Driver: '+d.name+(d.phone?', '+d.phone:''));
  if(!forP&&!isExt(s)&&!v&&s.vtype)L.push('Vehicle type: '+s.vtype);
  if(forP&&s.vtype)L.push('Vehicle type: '+s.vtype);
  if(s.notes){L.push('');L.push('Notes: '+s.notes);}
  if(s.req)L.push('Requirements: '+s.req);
  if(forP&&canMoney()&&!blank(s.cost)){var f=fin(s);L.push('');L.push('Agreed price: '+f.costNet.toFixed(2)+' EUR + VAT'+(f.costRate?' '+f.costRate+'%':'')+(f.costRate?' ('+f.costGross.toFixed(2)+' EUR)':''));}
  if(forP)L.push('Please confirm. Thank you.');
  return L.join('\n');
}
function drawSheet(s,mode){
  var W=1080,c=document.createElement('canvas');c.width=W;c.height=2400;
  var x=c.getContext('2d'),co=S.settings.company,v=veh(s.vehicleId),d=drv(s.driverId),forP=mode==='partner'||isExt(s);
  var INK='#0D2119',MUT='#5A6359',GOLD='#7D6820',LINE='#DADDD3',BG='#FFFFFF',DARK='#0B1C14',GOLD2='#CAB26A';
  var DISP='"Nunito",Arial,sans-serif',BODY='"Nunito",Arial,sans-serif';
  x.fillStyle=BG;x.fillRect(0,0,W,c.height);
  x.fillStyle=DARK;x.fillRect(0,0,W,220);
  x.textBaseline='alphabetic';
  x.fillStyle='#FFFFFF';x.font='800 76px '+DISP;x.fillText('Service sheet',64,124);
  x.fillStyle=GOLD2;x.font='500 32px '+BODY;x.fillText(co.name||'Private transfer and executive transport',64,178);
  if(s.ref){x.textAlign='right';x.fillStyle='#FFFFFF';x.font='500 34px '+BODY;x.fillText('#'+s.ref,W-64,124);x.textAlign='left';}
  function wrap(t,X,Y,maxW,lh){var words=String(t||'—').split(/\s+/),line='',yy=Y;for(var i=0;i<words.length;i++){var test=line?line+' '+words[i]:words[i];if(x.measureText(test).width>maxW&&line){x.fillText(line,X,yy);line=words[i];yy+=lh;}else line=test;}x.fillText(line,X,yy);return yy;}
  function lab(t,X,Y){x.fillStyle=MUT;x.font='500 26px '+BODY;x.fillText(t,X,Y);}
  function val(t,X,Y,maxW,size,weight){x.fillStyle=INK;x.font=(weight||500)+' '+(size||34)+'px '+BODY;return wrap(t,X,Y,maxW,(size||34)*1.28);}
  function section(t,Y){x.fillStyle=GOLD;x.font='600 32px '+BODY;x.fillText(t,64,Y);x.fillStyle=LINE;x.fillRect(64,Y+18,W-128,2);return Y+72;}
  function pair(l1,v1,l2,v2,Y){lab(l1,64,Y);var a=val(v1,64,Y+44,440);var b=Y;if(l2){lab(l2,560,Y);b=val(v2,560,Y+44,456);}return Math.max(a,b)+64;}
  var y=292;
  lab('Date',64,y);val(enDate(s.date),64,y+46,520,34,600);
  lab('Pick-up time',640,y);x.fillStyle=INK;x.font='800 68px '+DISP;x.fillText(s.time||'--:--',640,y+76);
  if(s.end){x.fillStyle=MUT;x.font='600 26px '+BODY;x.fillText('to '+s.end+' (est.)',845,y+74);}
  y+=132;
  var lug=[blank(s.checked)?'':s.checked+' checked',blank(s.cabin)?'':s.cabin+' cabin'].filter(Boolean).join(', ')||'—';
  y=pair('Passengers',(blank(s.pax)?'—':String(s.pax))+(s.booster?', baby seat':''),'Luggage',lug,y);
  y=section('Passenger',y);
  y=pair('Name',s.name||'—','Phone',s.phone||'—',y);
  if(s.email)y=pair('Email',s.email,null,null,y);
  y=section('Routing',y);
  lab('Pick-up',64,y);y=val(s.pickup||'—',64,y+46,W-128,38,600)+56;
  (s.stops||[]).forEach(function(st,i){lab(s.stops.length>1?'Stop '+(i+1):'Stop',64,y);y=val(st,64,y+46,W-128,34,500)+50;});
  lab('Drop-off',64,y);y=val(s.dropoff||'—',64,y+46,W-128,38,600)+56;
  if(s.flight){lab('Flight number',64,y);x.fillStyle=INK;x.font='600 38px '+BODY;x.fillText(s.flight,64,y+48);y+=112;}
  if(forP){y=section('Service',y);y=pair('Service',EVENTS_EN[s.event]||s.event||'Transfer','Vehicle type',s.vtype||'—',y);}
  else{y=section('Vehicle and driver',y);y=pair('Service',EVENTS_EN[s.event]||s.event||'Transfer','Vehicle',v?v.name+(v.plate?', '+v.plate:''):'—',y);y=pair('Driver',d?d.name:'—','Vehicle type',v?v.cat:(s.vtype||'—'),y);}
  if(s.notes||s.req||s.booster){
    y=section('Additional information',y);
    if(s.notes||s.booster){lab('Notes',64,y);y=val([s.booster?'Bring a child seat.':'',s.notes].filter(Boolean).join(' '),64,y+46,W-128)+56;}
    if(s.req){lab('Requirements',64,y);y=val(s.req,64,y+46,W-128)+56;}
  }
  y+=20;
  var foot=[co.phone,co.email,co.nif?'NIF '+co.nif:'',co.address].filter(Boolean);
  x.fillStyle=LINE;x.fillRect(64,y,W-128,2);
  x.fillStyle=MUT;x.font='500 26px '+BODY;
  y=wrap(foot.length?foot.join('   |   '):'Generated '+new Date().toLocaleDateString('en-GB'),64,y+50,W-128,34)+50;
  var out=document.createElement('canvas');out.width=W;out.height=Math.ceil(y);out.getContext('2d').drawImage(c,0,0);
  return out;
}
