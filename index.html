/* ---------- create: chooser, reading ---------- */
var sampleFn,imagesOK=false,aiOff=false,extractCtl=null;
var ICON={
  img:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>',
  cam:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  txt:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>',
  pen:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>'
};
function aiState(){return aiOff?'off':sampleFn===undefined?'loading':sampleFn===null?'off':'on';}
function openChooser(){
  var st=aiState(),img=st==='on'&&imagesOK;
  function opt(act,t,sub,ic,dis){return '<button type="button" class="opt" data-act="'+act+'"'+(dis?' disabled':'')+'>'+ICON[ic]+'<span><b>'+t+'</b><small>'+sub+'</small></span>'+I_CHEV+'</button>';}
  var on=st==='on';
  var note=st==='loading'?'A preparar a leitura automática.':!on?'A leitura automática de prints só funciona, por agora, quando abres a app dentro do Claude. Aqui, a imagem ou a mensagem ficam à vista enquanto preenches.':img?'O que for lido aparece no formulário para confirmares antes de guardar. No computador também podes colar um print aqui.':'Nesta vista só é possível ler texto colado. As imagens ficam à vista enquanto preenches.';
  var body='<p class="hint" style="margin-bottom:12px">Como chegou este serviço?</p><div class="group">'+
    opt('img','Print ou imagem',img?'Lemos os dados de outra app, email ou mensagem':'Fica à vista enquanto preenches','img',false)+
    opt('cam','Tirar fotografia',img?'Lemos os dados de uma folha em papel ou escrita à mão':'De uma folha em papel, fica à vista enquanto preenches','cam',false)+
    opt('txt','Colar texto',on?'Lemos os dados de uma mensagem de WhatsApp ou de um email':'A mensagem fica à vista enquanto preenches','txt',false)+
    opt('manual','Preencher à mão','Escreves tu os dados','pen',false)+
    '</div><p class="fine">'+note+'</p>';
  var nd=ui.newDate;
  openSheet('Novo serviço',body,'',{
    img:function(){$('#fileImg').click();},
    cam:function(){$('#fileCam').click();},
    txt:openPasteText,
    manual:function(){ui.newDate=nd;openEditor(null,null,{src:'manual'});}
  },function(){ui.newDate=null;});
  ui.chooser=true;
}
function openPasteText(){
  var on=aiState()==='on';
  var body='<div class="f"><label for="f_paste">Cola aqui a mensagem com os dados do serviço</label><textarea id="f_paste" rows="10" placeholder="Por exemplo: amanhã às 17h00, recolha no aeroporto, voo TP 1351, 2 pessoas, para o Hotel Avenida Palace"></textarea><p class="err" id="e_paste" hidden></p></div>';
  openSheet('Colar texto',body,'<button type="button" class="btn" data-act="read">'+(on?'Ler serviço':'Continuar')+'</button>',{
    read:function(){var t=$('#f_paste').value.trim();if(!t){var e=$('#e_paste');e.textContent='Cola primeiro a mensagem.';e.hidden=false;return;}
      if(on)runExtract({kind:'texto',text:t});else{ui.chooser=false;openEditor(null,null,{src:'texto',ref:true,refText:t});}}
  });
  try{$('#f_paste').focus();}catch(e){}
}
function extractPrompt(kind,text){
  var t=today(),types=typeNames().map(function(n){return JSON.stringify(n);}).join('|'),pn=live(S.partners).map(function(p){return p.name;});
  return 'Trabalhas para uma empresa portuguesa de transfers privados em Lisboa. '+(kind==='texto'?'O texto abaixo contém':'A imagem mostra')+
    ' um pedido de serviço de transfer: pode ser um print de outra app, uma mensagem, um email ou uma folha escrita à mão.\n'+
    'Extrai os dados de UM serviço e responde apenas com um objeto JSON com exatamente estas chaves:\n'+
    '{"date":"YYYY-MM-DD","time":"HH:MM","endTime":"HH:MM","bookingRef":string,"clientName":string,"clientPhone":string,"clientEmail":string,"pax":number,"checked":number,"cabin":number,"booster":boolean,"pickup":string,"stops":[string],"dropoff":string,"flight":string,"vehicleType":"Carro"|"Carro Executive"|"Van"|"Van VIP","clientType":"Particular"|"Empresa"|"VIP"|"Agência","eventType":'+types+',"source":string,"notes":string,"requirements":string,"price":number}\n'+
    'Regras: usa null em qualquer chave cujo dado não apareça e nunca inventes dados. Copia moradas, nomes, telefones e referências tal como aparecem. '+
    'Hoje é '+t+': converte datas relativas ("amanhã", "domingo") e, se faltar o ano, usa a próxima data possível. Converte horas de 12h para 24h. '+
    '"Not provided", "N/A" ou campos vazios contam como null. "checked" são malas de porão e "cabin" malas de cabine. "booster" é true só se pedirem cadeira de criança ou booster. '+
    '"stops" são paragens intermédias entre a recolha e o destino, por ordem; usa [] se não houver. "bookingRef" é o número da reserva ou do pedido. '+
    '"source" é a app, hotel, agência ou empresa de onde vem o pedido'+(pn.length?'; se for um destes parceiros, escreve o nome exatamente assim: '+pn.join(', '):'')+'. '+
    '"notes" são instruções para o motorista. "price" é o valor do serviço em euros, se aparecer. Se houver vários serviços, extrai só o primeiro.'+
    (kind==='texto'?'\n\nTexto:\n'+text.slice(0,8000):'');
}
function normalize(d){
  if(Array.isArray(d))d=d[0];
  if(!d||typeof d!=='object')return null;
  var out={};
  function str(v){if(v==null)return '';var s=String(v).trim();return /^(null|n\/a|not provided|none|-)$/i.test(s)?'':s;}
  var map={date:'date',time:'time',endTime:'end',bookingRef:'pref',clientName:'name',clientPhone:'phone',clientEmail:'email',pickup:'pickup',dropoff:'dropoff',flight:'flight',notes:'notes',requirements:'req'};
  Object.keys(map).forEach(function(k){var v=str(d[k]);if(v)out[map[k]]=v;});
  if(out.date&&!/^\d{4}-\d{2}-\d{2}$/.test(out.date))delete out.date;
  ['time','end'].forEach(function(k){if(out[k]){var m=/^(\d{1,2})[:h.](\d{2})/.exec(out[k]);if(m&&+m[1]<24)out[k]=pad(+m[1])+':'+m[2];else delete out[k];}});
  if(out.flight)out.flight=out.flight.toUpperCase();
  if(Array.isArray(d.stops)){var st=d.stops.map(str).filter(Boolean);if(st.length)out.stops=st;}
  ['pax','checked','cabin'].forEach(function(k){var n=parseInt(d[k],10);if(isFinite(n)&&n>=0)out[k]=n;});
  var p=parseFloat(d.price);if(isFinite(p)&&p>0&&canMoney())out.price=p;
  if(d.booster===true)out.booster=true;
  if(VTYPES.indexOf(d.vehicleType)>-1)out.vtype=d.vehicleType;
  if(CTYPES.indexOf(d.clientType)>-1)out.ctype=d.clientType;
  if(typeNames().indexOf(d.eventType)>-1)out.event=d.eventType;
  var src=str(d.source);
  if(src){var b=norm(src),pm=live(S.partners).filter(function(x){var a=norm(x.name);return a&&(a===b||a.indexOf(b)>-1||b.indexOf(a)>-1);})[0];
    if(pm){out.origin='partner';out.originPartnerId=pm.id;}else out.channel=src;}
  if(out.pref&&out.origin!=='partner'){out.inotes='Referência do pedido: '+out.pref;delete out.pref;}
  return out;
}
var PERMANENT=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];
function showExtractError(code,o){
  var what=o.kind==='texto'?'nesta mensagem':'nesta imagem';
  var msg={
    not_granted:'A leitura automática não foi autorizada. Podes preencher à mão.',
    sampling_disabled:'A leitura automática não está disponível nesta conta.',
    images_unavailable:'Nesta vista não é possível enviar imagens. Usa o texto colado ou preenche à mão.',
    image_rejected:'Esta imagem não pode ser lida. Experimenta um print em JPG ou PNG.',
    rate_limited:'Muitos pedidos seguidos. Tenta outra vez daqui a um minuto.',
    session_expired:'A sessão expirou. Volta a entrar no Claude e tenta outra vez.',
    invalid_json:'Não encontrei um serviço '+what+'. Tenta uma imagem mais nítida ou preenche à mão.',
    empty_completion:'Não encontrei um serviço '+what+'. Tenta uma imagem mais nítida ou preenche à mão.',
    refused:'Não foi possível ler '+what+'. Preenche à mão.',
    empty:'Não encontrei um serviço '+what+'. Tenta uma imagem mais nítida ou preenche à mão.'
  }[code];
  if(PERMANENT.indexOf(code)>-1){aiOff=true;msg=msg||'A leitura automática não está disponível nesta conta.';}
  if(code==='images_unavailable')imagesOK=false;
  msg=msg||'A ligação falhou. Tenta outra vez.';
  var img=o.file&&ui.imgURL?'<img class="thumb lg" src="'+ui.imgURL+'" alt="Imagem enviada" style="margin-top:14px">':'';
  openSheet('Não foi possível ler','<div class="notice bad"><b>'+esc(msg)+'</b></div>'+img,
    '<div class="row2"><button type="button" class="btn alt" data-act="again">Tentar outra</button><button type="button" class="btn" data-act="manual">Preencher à mão</button></div>',
    {again:openChooser,manual:function(){openEditor(null,null,{src:'manual',img:o.file?ui.imgURL:null});}});
}
function runExtract(o){
  ui.chooser=false;
  if(!sampleFn||aiOff){showExtractError('sampling_disabled',o);return;}
  var url=null,small=null;
  if(o.file){if(ui.imgURL){try{URL.revokeObjectURL(ui.imgURL);}catch(e){}}url=URL.createObjectURL(o.file);ui.imgURL=url;downscale(o.file,1400).then(function(u){small=u;},function(){small=null;});}
  var ctl=new AbortController();extractCtl=ctl;
  openSheet('A ler o serviço','<div class="reading">'+(url?'<img class="thumb lg" src="'+url+'" alt="Imagem enviada">':'')+'<div class="loadbar" aria-hidden="true"><span></span></div><p>A ler os dados '+(o.kind==='texto'?'da mensagem':'da imagem')+'. Pode demorar até um minuto.</p></div>',
    '<button type="button" class="btn alt" data-act="stop">Parar</button>',
    {stop:function(){ctl.abort();openChooser();}},
    function(){ctl.abort();});
  var opts={signal:ctl.signal,modelTier:'default'};
  if(o.file)opts.images=[o.file];
  sampleFn.json(extractPrompt(o.kind,o.text),opts).then(function(raw){
    if(ctl.signal.aborted||extractCtl!==ctl)return;
    extractCtl=null;
    var data=normalize(raw);
    if(!data||!(data.pickup||data.dropoff||data.name||data.time)){showExtractError('empty',o);return;}
    var keys=Object.keys(data);
    openEditor(null,data,{aiKeys:{has:function(k){return keys.indexOf(k)>-1;}},src:o.kind,img:url,imgData:small});
  },function(e){
    if(extractCtl===ctl)extractCtl=null;
    var code=e&&e.code;
    if(code==='cancelled'||ctl.signal.aborted)return;
    showExtractError(code,o);
  });
}
function withImage(f,kind){if(aiState()==='on'&&imagesOK)runExtract({kind:kind,file:f});else openWithImage(f,kind);}
function openWithImage(f,kind){
  ui.chooser=false;if(ui.imgURL){try{URL.revokeObjectURL(ui.imgURL);}catch(e){}}
  var url=URL.createObjectURL(f);ui.imgURL=url;
  downscale(f,1400).then(function(small){openEditor(null,null,{src:kind,img:url,imgData:small,ref:true});},function(){openEditor(null,null,{src:kind,img:url,ref:true});});
}
$('#fileImg').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];e.target.value='';if(f)withImage(f,'print');});
$('#fileCam').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];e.target.value='';if(f)withImage(f,'foto');});
document.addEventListener('paste',function(e){
  if(!ui.chooser)return;
  var files=e.clipboardData&&e.clipboardData.files?Array.prototype.slice.call(e.clipboardData.files):[];
  var f=files.find(function(x){return /^image\//.test(x.type);});
  if(f){e.preventDefault();withImage(f,'print');}
});
